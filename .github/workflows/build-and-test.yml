name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Build container
        run: docker build --tag oci-registry:test .

      - name: Smoke test container
        run: |
          container=$(docker run --detach --publish 127.0.0.1::5000 oci-registry:test)
          trap 'docker logs "$container"; docker rm --force --volumes "$container"' EXIT
          address=$(docker port "$container" 5000/tcp)
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 "http://${address}/v2/"
